# Build Acid into a DRAFT release (acid-vst-v<version>) with mpc-vst-plugins' shared workflow:
# Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a device,
# smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
#
# tools_ref is pinned to a commit on mpc-vst-plugins main (the portable one-folder layout; it has the label_scale= layout key this skin
# depends on, docs/SKIN_STUDIO.md, and the plugin_id/license catalog inputs).
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  acid:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@d55a4316ac57b08b5eec31a417559c1a5c3d11b9
    permissions:
      contents: write
    with:
      tag: acid-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: d55a4316ac57b08b5eec31a417559c1a5c3d11b9
      vst_dir: vst
      build: vst/build.sh
      host_test: vst/test.sh
      plugin_id: acid
      license: GPL-3.0-only
      about: A TB-303-style acid bassline sequencer (two lines, blendable) that drives a synth track over MIDI.
      dry_run: ${{ inputs.dry_run }}
