button cx=148 cy=300 label="GENERATE" key=a_generate
button cx=348 cy=300 label="MUTATE" key=a_mutate
toggle cx=560 cy=300 w=150 h=52 label="" key=mute img=images/mute_off.svg img_on=images/mute_on.svg
popup w=240 h=48 cx=1052 cy=326 label="REGEN" key=a_auto_gen
enum_h cx=1052 cy=427 sw=90 label="DIR" key=a_dir
knob cx=972 cy=581 r=40 label="BLEND A>B" key=blend
knob cx=1171 cy=597 r=24 label="MIDI CH" key=a_channel
knob cx=115 cy=411 r=36 label="DENSITY" key=a_density
knob cx=255 cy=411 r=36 label="ACCENT" key=a_accent
knob cx=395 cy=411 r=36 label="SLIDE" key=a_slide
knob cx=535 cy=411 r=36 label="HOLD" key=a_hold
knob cx=675 cy=411 r=36 label="VEL RAND" key=a_velrand
knob cx=115 cy=581 r=36 label="OCTAVES" key=a_octaves
knob cx=255 cy=581 r=36 label="SHIFT" key=a_shift
knob cx=395 cy=581 r=36 label="ALGO A" key=a_algo
knob cx=535 cy=581 r=36 label="LENGTH" key=a_length
knob cx=675 cy=581 r=36 label="GATE" key=a_gate
knob cx=815 cy=581 r=36 label="OFFSET" key=a_offset
qlinks "SEQ A" = a_density,a_accent,a_slide,a_octaves,a_algo,a_length,a_gate,a_offset,a_hold,a_shift,a_velrand,blend,a_channel,a_auto_gen,a_dir

