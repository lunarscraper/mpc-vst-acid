# Acid MPC skin layout: redone on the browser renderer (docs/SKIN_STUDIO.md, "art": "html" in
# vst.json) so real fonts and a CSS stylesheet (skin.css) can be used, matching mpc-jv880's own
# font choice (Univers 53 Extended for all baked panel text) instead of shadow_art's bitmap font.
# Each SEQ tab combines the old SEQUENCER + ADVANCED frames into one, folds that sequencer's own
# ALGO knob in from GLOBAL, and repeats the shared BLEND A>B knob so it's reachable without a tab
# switch. A top band (art file=images/acid_top.svg) carries the "ACID" wordmark in a second,
# fun/rounded font (Earth Normal) plus the classic acid-house smiley, faded into the background.
style=td3
art_css=skin.css
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00

[tab SEQ A]
art file=images/acid_top.svg x=36 y=88 w=1208 h=112
frame x=36 y=210 w=1207 h=502 title="SEQUENCER A"
button cx=122 cy=280 label="GENERATE" key=a_generate
button cx=295 cy=280 label="MUTATE" key=a_mutate
knob cx=467 cy=280 r=36 label="CHANNEL" key=a_channel
knob cx=640 cy=280 r=36 label="OFFSET" key=a_offset
knob cx=812 cy=280 r=36 label="ALGO A" key=a_algo
popup cx=1070 cy=280 w=260 h=48 label="REGEN" key=a_auto_gen
knob cx=122 cy=440 r=40 label="DENSITY" key=a_density
knob cx=295 cy=440 r=40 label="ACCENT" key=a_accent
knob cx=467 cy=440 r=40 label="SLIDE" key=a_slide
knob cx=640 cy=440 r=38 label="OCTAVES" key=a_octaves
knob cx=812 cy=440 r=38 label="LENGTH" key=a_length
knob cx=984 cy=440 r=38 label="GATE" key=a_gate
knob cx=1157 cy=440 r=38 label="BLEND A>B" key=blend
enum_h cx=640 cy=600 label="DIR" key=a_dir sw=100
qlinks "SEQ A" = a_generate,a_mutate,a_channel,a_offset,a_algo,a_auto_gen,a_density,a_accent,a_slide,a_octaves,a_length,a_gate,blend,a_dir

[tab SEQ B]
art file=images/acid_top.svg x=36 y=88 w=1208 h=112
frame x=36 y=210 w=1207 h=502 title="SEQUENCER B"
button cx=122 cy=280 label="GENERATE" key=b_generate
button cx=295 cy=280 label="MUTATE" key=b_mutate
knob cx=467 cy=280 r=36 label="CHANNEL" key=b_channel
knob cx=640 cy=280 r=36 label="TUNE" key=b_tune
knob cx=812 cy=280 r=36 label="ALGO B" key=b_algo
popup cx=1070 cy=280 w=260 h=48 label="REGEN" key=b_auto_gen
knob cx=122 cy=440 r=40 label="DENSITY" key=b_density
knob cx=295 cy=440 r=40 label="ACCENT" key=b_accent
knob cx=467 cy=440 r=40 label="SLIDE" key=b_slide
knob cx=640 cy=440 r=38 label="OCTAVES" key=b_octaves
knob cx=812 cy=440 r=38 label="LENGTH" key=b_length
knob cx=984 cy=440 r=38 label="GATE" key=b_gate
knob cx=1157 cy=440 r=38 label="BLEND A>B" key=blend
enum_h cx=640 cy=600 label="DIR" key=b_dir sw=100
qlinks "SEQ B" = b_generate,b_mutate,b_channel,b_tune,b_algo,b_auto_gen,b_density,b_accent,b_slide,b_octaves,b_length,b_gate,blend,b_dir

[tab GLOBAL]
art file=images/acid_top.svg x=36 y=88 w=1208 h=112
frame x=36 y=210 w=1207 h=502 title="GLOBAL"
popup cx=250 cy=290 w=320 h=52 label="SCALE" key=scale
popup cx=650 cy=290 w=220 h=52 label="ROOT" key=root
knob cx=1000 cy=284 r=44 label="BLEND A>B" key=blend
enum_h cx=340 cy=430 label="RESET" key=reset_bars sw=100
knob cx=650 cy=430 r=44 label="SWING" key=swing
knob cx=900 cy=430 r=44 label="JITTER" key=jitter
toggle cx=340 cy=580 label="CV MODE" key=cv_mode
enum_h cx=750 cy=580 label="BLEND MODE" key=blend_mode sw=70
qlinks "GLOBAL" = scale,root,blend,reset_bars,swing,jitter,cv_mode,blend_mode
