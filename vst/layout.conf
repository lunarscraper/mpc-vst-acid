# Acid MPC skin layout: same design language as force-acid's own
# addon/shadow_page.conf (two acid-line sequencers + a shared global block),
# rebuilt as a native MPC plugin skin by shadow_skin.py. One tab per
# sequencer plus GLOBAL; each tab's controls fit one Q-Link bank (13/13/10).
#
# Theme copied verbatim from addon/shadow_page.conf (yellow chassis, charcoal
# knobs, red buttons, black engine pill) so shadow_art's `theme|<this file>`
# pass renders pixel-matching art -- this is the "prework" every port needs:
# without it shadow_skin.py falls back to its own generic default palette.
style=td3
# Title font: vst.json's "title_font" (SHADOW_TITLE_FONT env var, Python/Pillow overlay) is the
# adopted convention for frame titles -- not a font_title= key here, to avoid two mechanisms
# drawing the same text (see docs/NOTES.md). font_label= (below) is a separate mechanism (baked
# in C by shadow_art) for everything else still baked: buttons, enum group labels and options.
font_label=fonts/Univers_53_Extended_Regular.otf
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00

[tab SEQ A]
frame x=36 y=88 w=610 h=624 title="SEQUENCER A"
frame x=670 y=88 w=573 h=624 title="ADVANCED A"
button cx=140 cy=170 label="GENERATE" key=a_generate
button cx=390 cy=170 label="MUTATE" key=a_mutate
knob cx=140 cy=310 r=44 label="DENSITY" key=a_density
knob cx=340 cy=310 r=44 label="ACCENT" key=a_accent
knob cx=540 cy=310 r=44 label="SLIDE" key=a_slide
knob cx=140 cy=460 r=40 label="OCTAVES" key=a_octaves
knob cx=340 cy=460 r=40 label="LENGTH" key=a_length
knob cx=540 cy=460 r=40 label="GATE" key=a_gate
enum_h cx=310 cy=600 label="DIR" key=a_dir sw=90
knob cx=760 cy=200 r=36 label="CHANNEL" key=a_channel
knob cx=940 cy=200 r=36 label="OFFSET" key=a_offset
popup cx=850 cy=420 w=240 h=48 label="REGEN" key=a_auto_gen
qlinks "SEQ A" = a_generate,a_mutate,a_density,a_accent,a_slide,a_octaves,a_length,a_gate,a_dir,a_channel,a_offset,a_auto_gen

[tab SEQ B]
frame x=36 y=88 w=610 h=624 title="SEQUENCER B"
frame x=670 y=88 w=573 h=624 title="ADVANCED B"
button cx=140 cy=170 label="GENERATE" key=b_generate
button cx=390 cy=170 label="MUTATE" key=b_mutate
knob cx=140 cy=310 r=44 label="DENSITY" key=b_density
knob cx=340 cy=310 r=44 label="ACCENT" key=b_accent
knob cx=540 cy=310 r=44 label="SLIDE" key=b_slide
knob cx=140 cy=460 r=40 label="OCTAVES" key=b_octaves
knob cx=340 cy=460 r=40 label="LENGTH" key=b_length
knob cx=540 cy=460 r=40 label="GATE" key=b_gate
enum_h cx=310 cy=600 label="DIR" key=b_dir sw=90
knob cx=760 cy=200 r=36 label="CHANNEL" key=b_channel
knob cx=940 cy=200 r=36 label="TUNE" key=b_tune
popup cx=850 cy=420 w=240 h=48 label="REGEN" key=b_auto_gen
qlinks "SEQ B" = b_generate,b_mutate,b_density,b_accent,b_slide,b_octaves,b_length,b_gate,b_dir,b_channel,b_tune,b_auto_gen

[tab GLOBAL]
frame x=36 y=88 w=1207 h=624 title="GLOBAL"
popup cx=280 cy=190 w=300 h=52 label="SCALE" key=scale
popup cx=900 cy=190 w=200 h=52 label="ROOT" key=root
knob cx=200 cy=400 r=42 label="BLEND A>B" key=blend
knob cx=400 cy=400 r=42 label="ALGO A" key=a_algo
knob cx=600 cy=400 r=42 label="ALGO B" key=b_algo
enum_h cx=900 cy=400 label="RESET" key=reset_bars sw=90
knob cx=200 cy=570 r=42 label="SWING" key=swing
knob cx=400 cy=570 r=42 label="JITTER" key=jitter
toggle cx=600 cy=570 label="CV MODE" key=cv_mode
enum_h cx=900 cy=570 label="BLEND MODE" key=blend_mode sw=60
qlinks "GLOBAL" = scale,root,blend,a_algo,b_algo,reset_bars,swing,jitter,cv_mode,blend_mode
