# Acid MPC skin layout: redone on the browser renderer (docs/SKIN_STUDIO.md, "art": "html" in
# vst.json) so real fonts and a CSS stylesheet (skin.css) can be used, matching mpc-jv880's own
# font choice (Univers 53 Extended for all baked panel text) instead of shadow_art's bitmap font.
# Each SEQ tab combines the old SEQUENCER + ADVANCED frames into one: GENERATE/MUTATE up top over
# a 4x2 knob grid (density/accent/slide/octaves, then algo/length/gate/offset-or-tune), with
# REGEN and DIR stacked in a column on the right, channel and the shared BLEND A>B knob under
# them. GLOBAL mirrors the same 4-column grid so all three tabs read the same way. A top band
# (art file=images/acid_top.svg) carries the "ACID" wordmark in a second, fun/rounded font
# (Earth Normal) plus the classic acid-house smiley, faded into the background.
style=td3
art_css=skin.css
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00

[tab SEQ A]
art file=images/acid_top.svg x=36 y=88 w=1208 h=112
frame x=36 y=210 w=1207 h=502 title="SEQUENCER A"
button cx=150 cy=270 label="GENERATE" key=a_generate
button cx=390 cy=270 label="MUTATE" key=a_mutate
popup cx=1070 cy=262 w=240 h=48 label="REGEN" key=a_auto_gen
knob cx=150 cy=410 r=42 label="DENSITY" key=a_density
knob cx=390 cy=410 r=42 label="ACCENT" key=a_accent
knob cx=630 cy=410 r=42 label="SLIDE" key=a_slide
knob cx=870 cy=410 r=42 label="OCTAVES" key=a_octaves
enum_h cx=1070 cy=380 label="DIR" key=a_dir sw=90
knob cx=150 cy=580 r=42 label="ALGO A" key=a_algo
knob cx=390 cy=580 r=42 label="LENGTH" key=a_length
knob cx=630 cy=580 r=42 label="GATE" key=a_gate
knob cx=870 cy=580 r=42 label="OFFSET" key=a_offset
knob cx=1000 cy=580 r=40 label="CHANNEL" key=a_channel
knob cx=1140 cy=580 r=40 label="BLEND A>B" key=blend
qlinks "SEQ A" = a_generate,a_mutate,a_density,a_accent,a_slide,a_octaves,a_algo,a_length,a_gate,a_offset,a_auto_gen,a_dir,a_channel,blend

