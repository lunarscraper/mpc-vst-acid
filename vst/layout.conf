# Acid MPC skin layout: redone on the browser renderer (docs/SKIN_STUDIO.md, "art": "html" in
# vst.json) so real fonts and a CSS stylesheet (skin.css) can be used, matching mpc-jv880's own
# font choice (Univers 53 Extended for all baked panel text) instead of shadow_art's bitmap font.
# Each SEQ tab combines the old SEQUENCER + ADVANCED frames into one: GENERATE/MUTATE up top over
# a 4x2 knob grid (density/accent/slide/octaves, then algo/length/gate/offset-or-tune), with
# REGEN and DIR stacked in a column on the right, channel and the shared BLEND A>B knob under
# them. GLOBAL mirrors the same 4-column grid so all three tabs read the same way. A top band
# (art file=images/acid_top.svg) carries the "ACID" wordmark in a second, fun/rounded font
# (Earth Normal) plus the classic acid-house smiley, faded into the background.
# SEQ tabs: a 6-column knob grid -- row 1 what plays (density, accent, slide, hold, vel rand), row 2
# pitch and timing (octaves, shift, algo, length, gate, offset/tune); HOLD, SHIFT and VEL RAND were added
# after the NGEN ACDGEN. GLOBAL: right half as a 3x3 grid (swing/jitter/control ch, load/preset/save,
# mute/blend/cv mode).
# Q-Links carry knobs and selectors only: GENERATE/MUTATE/LOAD/SAVE, MUTE and CV MODE stay on the
# touchscreen (and on MIDI CC, see README), so turning a Q-Link never fires a trigger by accident.
# Shared by both variants: ../vst-fx (Acid FX, insert effect) uses this file unchanged.
style=td3
label_scale=1.05
scale_names=1
art_css=skin.css
knob_look=rubber
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_knob_dot=f5c400
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00

